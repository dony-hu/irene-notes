<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宝安城市运营中心智能体平台汇报</title>
  <style>
    :root {
      --bg: #07111f;
      --bg2: #0b1f37;
      --panel: rgba(12, 28, 52, 0.86);
      --panel2: rgba(14, 39, 74, 0.76);
      --line: rgba(111, 196, 255, 0.25);
      --text: #ecf5ff;
      --muted: #a7bfd8;
      --accent: #59d0ff;
      --accent2: #6dffcd;
      --warn: #ffcf5a;
      --danger: #ff7c7c;
      --shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background:
        radial-gradient(circle at 20% 10%, rgba(79, 177, 255, .18), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(33, 255, 189, .10), transparent 22%),
        linear-gradient(180deg, #07111f 0%, #08192c 60%, #081521 100%);
      color: var(--text);
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    .deck {
      width: 100%; height: 100%; position: relative;
    }
    .slide {
      position: absolute; inset: 0;
      padding: 56px 68px 70px;
      display: none;
      background:
        linear-gradient(135deg, rgba(255,255,255,.02), rgba(255,255,255,0) 30%),
        radial-gradient(circle at right bottom, rgba(89,208,255,.08), transparent 30%);
    }
    .slide.active { display: flex; flex-direction: column; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      color: var(--muted); font-size: 14px; letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .title {
      font-size: 42px; line-height: 1.18; font-weight: 800; letter-spacing: -0.02em;
      margin: 0 0 14px 0;
      max-width: 1200px;
    }
    .subtitle {
      font-size: 20px; line-height: 1.7; color: var(--muted); margin: 0 0 26px;
      max-width: 1180px;
    }
    .grid-2 { display: grid; grid-template-columns: 1.08fr .92fr; gap: 24px; flex: 1; min-height: 0; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 24px 26px;
      backdrop-filter: blur(14px);
    }
    .panel.soft { background: var(--panel2); }
    .kicker {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid rgba(109,255,205,.28);
      padding: 8px 14px; border-radius: 999px;
      color: var(--accent2); font-size: 13px; margin-bottom: 18px;
      background: rgba(109,255,205,.08);
    }
    h2, h3, h4 { margin: 0 0 14px; }
    h3 { font-size: 26px; }
    h4 { font-size: 18px; color: var(--accent); }
    p { margin: 0 0 12px; line-height: 1.72; color: var(--text); }
    ul { margin: 0; padding-left: 22px; }
    li { margin: 10px 0; line-height: 1.65; color: var(--text); }
    .muted { color: var(--muted); }
    .big-number { font-size: 72px; font-weight: 800; color: var(--accent2); line-height: 1; }
    .metric { display: flex; flex-direction: column; gap: 10px; }
    .tag { display:inline-block; padding: 6px 10px; border-radius: 999px; font-size: 12px; color: var(--accent); background: rgba(89,208,255,.08); border: 1px solid rgba(89,208,255,.18); }
    .footer {
      margin-top: 18px; display:flex; justify-content:space-between; align-items:center; color: var(--muted); font-size: 13px;
    }
    .page { letter-spacing: .08em; }
    .timeline { display: grid; gap: 14px; }
    .step {
      display: grid; grid-template-columns: 58px 1fr; gap: 14px; align-items: start;
      padding: 14px 0; border-top: 1px solid rgba(255,255,255,.08);
    }
    .step:first-child { border-top: none; padding-top: 0; }
    .step-num {
      width: 44px; height: 44px; border-radius: 14px; display:flex; align-items:center; justify-content:center;
      background: rgba(89,208,255,.12); border:1px solid rgba(89,208,255,.25); color:var(--accent); font-weight:700;
    }
    .flow {
      display:flex; gap:10px; flex-wrap:wrap; margin-top: 14px;
    }
    .flow span {
      padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); color: var(--text); font-size: 14px;
    }
    .hero {
      display:grid; grid-template-columns: 1.18fr .82fr; gap: 28px; flex: 1; align-items: stretch;
    }
    .hero-visual {
      position: relative; overflow: hidden; border-radius: 28px; border:1px solid var(--line); background:
      linear-gradient(180deg, rgba(89,208,255,.14), rgba(89,208,255,.03)),
      linear-gradient(135deg, rgba(17,50,96,.95), rgba(10,24,45,.92));
      box-shadow: var(--shadow);
      min-height: 520px;
    }
    .hero-visual::before {
      content:""; position:absolute; inset: 24px; border-radius: 22px; border:1px solid rgba(255,255,255,.08);
      background:
        radial-gradient(circle at 20% 30%, rgba(90, 208, 255, .15), transparent 26%),
        radial-gradient(circle at 70% 40%, rgba(109,255,205,.10), transparent 20%),
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    }
    .hero-map, .hero-chat, .hero-video, .hero-panel {
      position:absolute; border-radius:18px; border:1px solid rgba(255,255,255,.1); background: rgba(4, 13, 26, .72); backdrop-filter: blur(10px);
      box-shadow: 0 14px 40px rgba(0,0,0,.22);
    }
    .hero-map { left: 44px; top: 42px; width: 58%; height: 58%; }
    .hero-panel { right: 44px; top: 42px; width: 28%; height: 28%; }
    .hero-video { right: 44px; bottom: 42px; width: 42%; height: 38%; }
    .hero-chat { left: 44px; bottom: 42px; width: 48%; height: 26%; }
    .mock-title { color: var(--accent2); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 12px 14px; border-bottom:1px solid rgba(255,255,255,.08); }
    .mock-body { padding: 14px; font-size: 14px; line-height: 1.6; color: var(--muted); }
    .cards { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
    .card {
      padding: 18px; border-radius: 20px; background: rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
    }
    .card h4 { margin-bottom: 10px; }
    .quote {
      padding: 24px 26px; font-size: 28px; line-height: 1.55; color: var(--text);
      border-left: 4px solid var(--accent2); background: rgba(109,255,205,.06); border-radius: 18px;
    }
    .matrix {
      display:grid; grid-template-columns: 180px repeat(3, 1fr); gap: 10px; font-size: 14px;
    }
    .matrix div {
      padding: 14px 12px; border-radius: 14px; border:1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); line-height: 1.55;
    }
    .matrix .head { color: var(--accent2); font-weight: 700; background: rgba(109,255,205,.08); }
    .pill-list { display:flex; flex-wrap:wrap; gap: 10px; }
    .pill { padding: 10px 14px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: var(--text); font-size: 14px; }
    .cover-note { font-size: 18px; line-height:1.8; color: var(--muted); max-width: 640px; }
    .nav-help {
      position: fixed; right: 20px; bottom: 16px; z-index: 20; color: var(--muted); font-size: 12px; opacity: .9;
      background: rgba(6,18,31,.6); padding: 8px 12px; border-radius: 999px; border:1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
    }
    @media (max-width: 1100px) {
      .slide { padding: 32px 28px 42px; overflow: auto; }
      .hero, .grid-2, .grid-3, .grid-4, .matrix { grid-template-columns: 1fr; }
      .hero-visual { min-height: 380px; }
      .title { font-size: 32px; }
      .subtitle { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="deck" id="deck"></div>

  <script>

            </div>
            <div class="hero-visual">

            <div class="panel"><h3>02 总体方案</h3><ul><li>总体定位</li><li>前后台架构</li><li>多角色交互设计</li></ul></div>

      },
      {

    const deck = document.getElementById('deck');
    slides.forEach((s, idx) => {
      const slide = document.createElement('section');
      slide.className = 'slide';
      slide.innerHTML = `
        <div class="topbar"><div>${s.section}</div><div>${idx + 1} / ${slides.length}</div></div>
        <h1 class="title">${s.title.replace(/\n/g, '<br>')}</h1>
        <p class="subtitle">${s.subtitle}</p>
        ${s.content}
        <div class="footer"><div>宝安城市运营中心智能体平台汇报稿</div><div class="page">PAGE ${String(idx + 1).padStart(2,'0')}</div></div>`;
      deck.appendChild(slide);
    });

    let current = 0;
    const nodes = Array.from(document.querySelectorAll('.slide'));
    function show(i) {
      current = (i + nodes.length) % nodes.length;
      nodes.forEach((n, idx) => n.classList.toggle('active', idx === current));
      location.hash = `slide-${current + 1}`;
    }
    function next() { show(current + 1); }
    function prev() { show(current - 1); }
    document.addEventListener('keydown', (e) => {
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); next(); }
      if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
      if (e.key.toLowerCase() === 'f') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      }
      if (e.key === 'Home') show(0);
      if (e.key === 'End') show(nodes.length - 1);
    });
    document.addEventListener('click', (e) => {
      const ignore = e.target.closest('a, button, input, textarea');
      if (!ignore) next();
    });
    const hash = location.hash.match(/slide-(\d+)/);
    show(hash ? Math.max(0, Math.min(nodes.length - 1, Number(hash[1]) - 1)) : 0);
  </script>
