<svg width="1600" height="480" viewBox="0 0 1600 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1600" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6F3FF"/>
      <stop offset="0.5" stop-color="#F0E6FF"/>
      <stop offset="1" stop-color="#FFE6F2"/>
    </linearGradient>
    <linearGradient id="blackHair" x1="800" y1="10" x2="1400" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3C3C43"/>
      <stop offset="1" stop-color="#1D1D22"/>
    </linearGradient>
    <linearGradient id="blackHairHighlight" x1="800" y1="10" x2="1400" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A5A66" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3C3C44" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="schoolBlouse" x1="850" y1="280" x2="1350" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F5F5"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="480" fill="url(#bgGrad)"/>

  <!-- Soft bokeh background -->
  <g opacity="0.35" filter="url(#softGlow)">
    <circle cx="140" cy="100" r="50" fill="#FFFFFF"/>
    <circle cx="220" cy="60" r="35" fill="#E5F0FF"/>
    <circle cx="1420" cy="80" r="55" fill="#F0E6FF"/>
    <circle cx="1500" cy="140" r="40" fill="#FFE6F2"/>
  </g>

  <!-- Light sparkles -->
  <g opacity="0.6">
    <circle cx="180" cy="180" r="2" fill="#FFFFFF"/>
    <circle cx="200" cy="160" r="1.5" fill="#FFFFFF"/>
    <circle cx="210" cy="190" r="1.5" fill="#FFFFFF"/>
    <circle cx="1460" cy="200" r="2" fill="#FFFFFF"/>
    <circle cx="1480" cy="170" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Main character - black hair, big eyes, half body -->
  <g transform="translate(920 10)">
    <!-- Big volume long black hair -->
    <path d="M260 110 C 210 60 140 50 70 80 C 0 110 -40 170 -20 240 C 0 310 45 370 90 405 C 135 440 190 455 250 445 C 310 435 355 390 385 335 C 415 280 420 220 395 170 C 370 120 320 160 260 110Z" fill="url(#blackHair)"/>
    <path d="M395 170 C 425 205 440 250 440 300 C 440 350 415 395 380 430 C 345 465 300 475 255 468" fill="url(#blackHair)"/>
    <!-- Hair highlights for shine -->
    <path d="M60 90 C 25 120 0 160 -10 200" stroke="url(#blackHairHighlight)" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M330 130 C 355 160 370 200 375 240" stroke="url(#blackHairHighlight)" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M160 60 C 120 70 85 95 55 130" stroke="url(#blackHairHighlight)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M280 420 C 310 435 335 450 350 465" stroke="url(#blackHairHighlight)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Hair falling forward -->
    <path d="M70 180 C 40 220 30 270 40 320 C 50 370 70 400 70 400" fill="url(#blackHair)"/>

    <!-- Face -->
    <ellipse cx="180" cy="170" rx="88" ry="98" fill="#FFFAF5"/>
    
    <!-- BIG EYES - very prominent -->
    <ellipse cx="138" cy="165" rx="22" ry="30" fill="#1A1A2E"/>
    <ellipse cx="222" cy="170" rx="22" ry="30" fill="#1A1A2E"/>
    <!-- Multiple highlights for glossy anime eyes -->
    <circle cx="132" cy="152" r="9" fill="#FFFFFF"/>
    <circle cx="216" cy="157" r="9" fill="#FFFFFF"/>
    <circle cx="142" cy="170" r="5" fill="#FFFFFF"/>
    <circle cx="226" cy="175" r="5" fill="#FFFFFF"/>
    
    <!-- LONG THICK EYELASHES -->
    <g stroke="#1A1A2E" stroke-width="3" stroke-linecap="round">
      <!-- Left eye -->
      <path d="M108 146 L 100 138"/>
      <path d="M114 138 L 106 128"/>
      <path d="M124 132 L 116 122"/>
      <path d="M136 130 L 136 120"/>
      <path d="M148 132 L 152 122"/>
      <path d="M160 138 L 166 128"/>
      <path d="M166 146 L 172 138"/>
      <!-- Right eye -->
      <path d="M192 151 L 184 143"/>
      <path d="M200 143 L 192 133"/>
      <path d="M210 137 L 202 127"/>
      <path d="M222 135 L 222 125"/>
      <path d="M234 137 L 238 127"/>
      <path d="M246 143 L 252 133"/>
      <path d="M252 151 L 258 143"/>
    </g>
    
    <!-- Eyebrows -->
    <path d="M108 128 Q 126 114 146 122" stroke="#4A4A5A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M204 129 Q 222 115 242 123" stroke="#4A4A5A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    
    <!-- Soft pink blush -->
    <ellipse cx="105" cy="198" rx="20" ry="11" fill="#FFB8C8" opacity="0.65"/>
    <ellipse cx="255" cy="202" rx="20" ry="11" fill="#FFB8C8" opacity="0.65"/>
    
    <!-- Small delicate nose -->
    <path d="M176 182 L 180 182 L 178 196" stroke="#DBC8CC" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Gentle cute smile -->
    <path d="M162 212 Q 180 222 198 212" stroke="#BB7788" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Bangs -->
    <path d="M105 100 C 128 75 155 62 180 60 C 205 62 232 75 255 100 C 235 78 210 65 180 62 C 150 65 125 78 105 100Z" fill="url(#blackHair)"/>

    <!-- Upper body / bust shot - white school blouse -->
    <path d="M40 255 C 85 220 275 220 320 255 C 355 280 370 375 370 460 C 370 470 0 470 0 460 C 0 375 15 280 40 255Z" fill="url(#schoolBlouse)"/>
    
    <!-- Small blue ribbon -->
    <ellipse cx="180" cy="275" rx="28" cy="20" fill="#8EC5F5"/>
    <rect x="168" y="268" width="24" height="14" fill="#FFFFFF" rx="4"/>
  </g>

</svg>
