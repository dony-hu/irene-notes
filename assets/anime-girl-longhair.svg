<svg width="1600" height="480" viewBox="0 0 1600 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1600" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5E6FF"/>
      <stop offset="0.5" stop-color="#E6F7FF"/>
      <stop offset="1" stop-color="#FFF0F5"/>
    </linearGradient>
    <linearGradient id="hairGradient" x1="1050" y1="80" x2="1250" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5A8D"/>
      <stop offset="1" stop-color="#5A3D5C"/>
    </linearGradient>
    <linearGradient id="hairHighlight" x1="1050" y1="80" x2="1250" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A87AAA" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7A4F7C" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sweaterGradient" x1="1080" y1="240" x2="1220" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8E0FF"/>
      <stop offset="1" stop-color="#8EC5F5"/>
    </linearGradient>
    <filter id="blurSoft" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="480" fill="url(#bgGradient)"/>

  <!-- Floating sakura petals -->
  <g opacity="0.5">
    <ellipse cx="180" cy="150" rx="12" ry="6" fill="#FFD1DC" transform="rotate(-20 180 150)"/>
    <ellipse cx="280" cy="90" rx="10" ry="5" fill="#FFE1E9" transform="rotate(30 280 90)"/>
    <ellipse cx="420" cy="180" rx="14" ry="7" fill="#FFD6E0" transform="rotate(-15 420 180)"/>
    <ellipse cx="1380" cy="120" rx="11" ry="6" fill="#FFD1DC" transform="rotate(45 1380 120)"/>
    <ellipse cx="1480" cy="200" rx="9" ry="4" fill="#FFE8F0" transform="rotate(-30 1480 200)"/>
    <ellipse cx="320" cy="320" rx="8" ry="4" fill="#FFD6E0" transform="rotate(25 320 320)"/>
  </g>

  <!-- Soft cloud shapes -->
  <g opacity="0.3" filter="url(#blurSoft)">
    <circle cx="200" cy="100" r="60" fill="#FFFFFF"/>
    <circle cx="320" cy="130" r="50" fill="#FFFFFF"/>
    <circle cx="1400" cy="80" r="65" fill="#FFFFFF"/>
    <circle cx="1480" cy="150" r="45" fill="#FFFFFF"/>
  </g>

  <!-- Distant hills -->
  <g opacity="0.2">
    <path d="M0 420 Q 200 380 400 400 T 800 420" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" fill="none"/>
    <path d="M800 440 Q 1000 400 1200 420 T 1600 430" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Long haired anime girl -->
  <g transform="translate(950 50)">
    <!-- Long hair flows down -->
    <path d="M130 140 C 80 160 40 220 30 300 C 20 380 40 420 80 440 C 120 460 180 450 220 430 C 250 410 260 360 250 280 C 240 200 220 150 210 130 C 200 100 170 80 140 70 C 110 80 80 100 130 140Z" fill="url(#hairGradient)"/>
    <path d="M140 70 C 170 75 200 95 220 130 C 240 165 255 210 262 265 C 267 310 263 355 253 390 C 243 415 220 435 195 448 C 160 465 120 462 85 448 C 55 432 35 402 25 360 C 15 305 25 255 45 210 C 65 165 95 135 130 140Z" fill="url(#hairGradient)"/>
    <path d="M60 280 C 50 330 55 370 70 395 C 85 420 105 435 125 442" stroke="url(#hairHighlight)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M200 220 C 215 260 218 310 210 350 C 202 380 185 405 165 422" stroke="url(#hairHighlight)" stroke-width="10" stroke-linecap="round" fill="none"/>

    <!-- Face -->
    <ellipse cx="140" cy="160" rx="65" ry="75" fill="#FFEBEF"/>
    
    <!-- Eyes -->
    <ellipse cx="110" cy="155" rx="10" ry="14" fill="#3A3A5C"/>
    <ellipse cx="170" cy="155" rx="10" ry="14" fill="#3A3A5C"/>
    <circle cx="108" cy="152" r="4" fill="#FFFFFF"/>
    <circle cx="168" cy="152" r="4" fill="#FFFFFF"/>
    
    <!-- Blush -->
    <ellipse cx="88" cy="175" rx="14" ry="8" fill="#FFB6C1" opacity="0.6"/>
    <ellipse cx="192" cy="175" rx="14" ry="8" fill="#FFB6C1" opacity="0.6"/>
    
    <!-- Eyebrows -->
    <path d="M96 130 Q 105 124 116 128" stroke="#6A5A7C" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M164 128 Q 175 124 184 130" stroke="#6A5A7C" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Mouth -->
    <path d="M132 182 Q 140 188 148 182" stroke="#D988A6" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Hair strands framing face -->
    <path d="M85 140 C 70 160 60 185 58 210" stroke="url(#hairGradient)" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M195 135 C 208 155 218 180 220 205" stroke="url(#hairGradient)" stroke-width="16" stroke-linecap="round" fill="none"/>
    
    <!-- Bangs -->
    <path d="M90 110 C 100 90 120 80 140 80 C 160 80 180 90 190 110" fill="url(#hairGradient)"/>
    <path d="M100 110 C 110 95 125 85 140 82" fill="url(#hairHighlight)"/>

    <!-- Sweater body -->
    <path d="M60 230 C 90 210 190 210 220 230 C 240 250 250 380 250 420 C 250 430 40 430 40 420 C 40 380 50 250 60 230Z" fill="url(#sweaterGradient)"/>
    
    <!-- Collar -->
    <path d="M90 225 L 140 255 L 190 225" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Title text -->
  <g transform="translate(110 140)">
    <text x="0" y="50" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="56" font-weight="700" fill="#6A4A7C">Irene Notes</text>
    <text x="2" y="100" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" fill="#8A6A9C">日系温柔风 · 记录生活与思考</text>
    <text x="2" y="140" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#9E88AF">A peaceful corner for ideas, stories, and daily growth.</text>
  </g>
</svg>
