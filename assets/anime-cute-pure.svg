<svg width="1600" height="480" viewBox="0 0 1600 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyBg" x1="0" y1="0" x2="1600" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F4FF"/>
      <stop offset="0.5" stop-color="#F8F0FF"/>
      <stop offset="1" stop-color="#FFF5F8"/>
    </linearGradient>
    <linearGradient id="hairBrown" x1="980" y1="40" x2="1300" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D4B595"/>
      <stop offset="1" stop-color="#BC8F6F"/>
    </linearGradient>
    <linearGradient id="hairHighlight" x1="980" y1="40" x2="1300" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5E0C5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D4B595" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="dressBlue" x1="1020" y1="200" x2="1260" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A8E6FF"/>
      <stop offset="1" stop-color="#7ECFFF"/>
    </linearGradient>
    <filter id="softBlur" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background sky -->
  <rect width="1600" height="480" fill="url(#skyBg)"/>

  <!-- Clouds -->
  <g opacity="0.6" filter="url(#softBlur)">
    <ellipse cx="150" cy="100" rx="70" ry="35" fill="#FFFFFF"/>
    <ellipse cx="220" cy="100" rx="55" ry="30" fill="#FFFFFF"/>
    <ellipse cx="1420" cy="80" rx="80" ry="40" fill="#FFFFFF"/>
    <ellipse cx="1500" cy="100" rx="60" ry="32" fill="#FFFFFF"/>
    <ellipse cx="380" cy="60" rx="45" ry="25" fill="#FFFFFF"/>
  </g>

  <!-- Distant cherry blossoms -->
  <g opacity="0.35">
    <circle cx="120" cy="380" r="60" fill="#FFE0E9"/>
    <circle cx="1480" cy="360" r="80" fill="#FFE0E9"/>
  </g>

  <!-- Wind lines -->
  <g opacity="0.25" stroke="#FFFFFF" stroke-width="3">
    <path d="M60 340 Q 180 310 300 330" stroke-linecap="round"/>
    <path d="M80 380 Q 200 350 320 370" stroke-linecap="round"/>
  </g>

  <!-- Pure anime girl - bigger pose -->
  <g transform="translate(920 30)">
    <!-- Long flowing hair blown by wind -->
    <path d="M160 120 C 110 130 70 170 50 220 C 30 280 35 340 60 390 C 85 430 120 440 160 420 C 200 400 230 360 250 320 C 270 280 280 230 260 180 C 240 130 200 110 160 120Z" fill="url(#hairBrown)"/>
    <path d="M260 180 C 285 200 305 240 315 290 C 325 340 315 380 295 410 C 275 440 240 455 200 445" fill="url(#hairBrown)"/>
    <path d="M160 120 C 130 125 100 150 80 180 C 60 210 45 250 40 290" stroke="url(#hairHighlight)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M210 140 C 230 160 245 195 250 230 C 255 265 250 300 240 330" stroke="url(#hairHighlight)" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Hair over shoulder -->
    <path d="M155 150 C 130 180 110 220 105 260 C 100 300 110 340 120 380 C 130 410 145 430 145 430" fill="url(#hairBrown)"/>

    <!-- Face - slightly tilted -->
    <ellipse cx="165" cy="165" rx="70" ry="82" fill="#FFFAF0"/>
    
    <!-- Eyes bigger, softer -->
    <ellipse cx="135" cy="158" rx="12" ry="16" fill="#2D2D4A"/>
    <ellipse cx="195" cy="162" rx="12" ry="16" fill="#2D2D4A"/>
    <circle cx="132" cy="154" r="5" fill="#FFFFFF"/>
    <circle cx="192" cy="158" r="5" fill="#FFFFFF"/>
    
    <!-- Eyelashes -->
    <path d="M122 146 L 118 142" stroke="#2D2D4A" stroke-width="2" stroke-linecap="round"/>
    <path d="M135 142 L 135 138" stroke="#2D2D4A" stroke-width="2" stroke-linecap="round"/>
    <path d="M146 146 L 150 142" stroke="#2D2D4A" stroke-width="2" stroke-linecap="round"/>
    <path d="M182 150 L 178 146" stroke="#2D2D4A" stroke-width="2" stroke-linecap="round"/>
    <path d="M195 146 L 195 142" stroke="#2D2D4A" stroke-width="2" stroke-linecap="round"/>
    <path d="M206 150 L 210 146" stroke="#2D2D4A" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Eyebrows - gentle curve -->
    <path d="M118 136 Q 128 129 142 133" stroke="#8B7889" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M180 138 Q 192 131 205 136" stroke="#8B7889" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Soft blush -->
    <ellipse cx="112" cy="185" rx="16" ry="9" fill="#FFCBD5" opacity="0.65"/>
    <ellipse cx="218" cy="188" rx="16" ry="9" fill="#FFCBD5" opacity="0.65"/>
    
    <!-- Small gentle smile -->
    <path d="M155 190 Q 165 196 175 190" stroke="#BB7788" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Bangs -->
    <path d="M110 120 C 125 95 145 82 165 80 C 185 82 205 95 220 120 C 205 105 185 92 165 90 C 145 92 125 105 110 120Z" fill="url(#hairBrown)"/>
    
    <!-- Side hair strands -->
    <path d="M95 160 C 82 180 75 205 72 230" stroke="url(#hairBrown)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M235 170 C 248 190 255 215 258 240" stroke="url(#hairBrown)" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- Dress - sailor style -->
    <path d="M100 230 C 130 210 200 210 230 230 C 250 250 260 390 260 430 C 260 440 70 440 70 430 C 70 390 80 250 100 230Z" fill="url(#dressBlue)"/>
    
    <!-- Sailor collar -->
    <path d="M95 225 L 165 270 L 235 225 L 165 248 Z" fill="#FFFFFF"/>
    
    <!-- Bow on chest -->
    <circle cx="165" cy="258" r="14" fill="#FFA8C5"/>
    <rect x="158" y="255" width="14" height="6" fill="#FFFFFF" rx="2"/>
  </g>

  <!-- Title text -->
  <g transform="translate(100 150)">
    <text x="0" y="50" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="58" font-weight="700" fill="#5A6A9C">Irene Notes</text>
    <text x="2" y="102" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" fill="#7A8AB2">清纯日系 · 随风吹拂的长发少女</text>
    <text x="2" y="142" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#8E9BBF">记录生活中每一份清澈美好的小确幸</text>
  </g>
</svg>
